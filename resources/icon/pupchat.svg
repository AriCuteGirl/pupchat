<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ac8ff"/>
      <stop offset="1" stop-color="#0a84ff"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0b98d"/>
      <stop offset="1" stop-color="#d9915c"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Floppy ears (behind the bubble) -->
  <path d="M150 128 C 92 96, 26 128, 18 214 C 12 284, 38 338, 82 344 C 116 348, 126 310, 132 270 C 138 222, 160 172, 176 140 Z" fill="url(#ear)"/>
  <path d="M362 128 C 420 96, 486 128, 494 214 C 500 284, 474 338, 430 344 C 396 348, 386 310, 380 270 C 374 222, 352 172, 336 140 Z" fill="url(#ear)"/>
  <!-- inner ear shading -->
  <path d="M120 150 C 84 146, 56 180, 52 230 C 48 280, 64 314, 88 316 C 104 300, 108 256, 118 214 Z" fill="#c47a45" opacity="0.35"/>
  <path d="M392 150 C 428 146, 456 180, 460 230 C 464 280, 448 314, 424 316 C 408 300, 404 256, 394 214 Z" fill="#c47a45" opacity="0.35"/>
  <!-- Speech bubble with tail -->
  <path d="M256 104 C 368 104, 448 176, 448 268 C 448 360, 368 428, 256 428 C 226 428, 198 424, 172 416 C 150 438, 114 452, 76 452 C 98 432, 110 410, 112 384 C 84 354, 64 314, 64 268 C 64 176, 144 104, 256 104 Z" fill="url(#bubble)"/>
  <!-- Liquid glass highlight -->
  <path d="M256 120 C 356 120, 424 176, 432 246 C 380 210, 320 196, 256 196 C 192 196, 132 210, 80 246 C 88 176, 156 120, 256 120 Z" fill="url(#gloss)"/>
  <!-- Paw print -->
  <g fill="#ffffff">
    <ellipse cx="256" cy="300" rx="52" ry="44"/>
    <ellipse cx="190" cy="242" rx="22" ry="28" transform="rotate(-18 190 242)"/>
    <ellipse cx="232" cy="214" rx="22" ry="29" transform="rotate(-6 232 214)"/>
    <ellipse cx="280" cy="214" rx="22" ry="29" transform="rotate(6 280 214)"/>
    <ellipse cx="322" cy="242" rx="22" ry="28" transform="rotate(18 322 242)"/>
  </g>
</svg>
